name: zizzu

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: zizzu
      POSTGRES_PASSWORD: zizzu

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
