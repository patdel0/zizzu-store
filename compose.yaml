name: zizzu

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: zizzu
      POSTGRES_PASSWORD: zizzu
      POSTGRES_DB: zizzu
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  db-data:
