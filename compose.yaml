services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:lts
    working_dir: /code
    command: npm run dev -- --host 0.0.0.0
    environment:
      - 'VITE_API_URL=http://localhost:8080'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/code
