name: 'Backend Checks'

on: 'push'


defaults:
  run:
    shell: 'bash'

jobs:
  checks:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          working-directory: "/backend"
          run: java --version