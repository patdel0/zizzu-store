name: 'Backend'

on:
  push:
    paths-ignore:
      - 'frontend/**'

defaults:
  run:
    shell: 'bash'

jobs:
  backend:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          run: java --version

      - name: "Run tests"
        run: ./script/test backend
